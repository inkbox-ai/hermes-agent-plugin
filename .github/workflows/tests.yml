name: PR checks — lint · unit · contract

on:
  push:
    branches: [main]
  pull_request:                     # catches PRs from feature branches → main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Offline unit suite + lint. No Hermes host installed → conftest stubs gateway.*
  # and the contract tests auto-skip. Fast signal on our own code — cheap enough to
  # run on every push, including draft PRs (the heavy live suite is what we gate).
  unit:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install \
            'audioop-lts>=0.2.1; python_version >= "3.13"' 'inkbox>=0.7.11,<1.0.0' \
            'aiohttp>=3.9' 'segno>=1.5' 'pytest>=8' 'ruff>=0.11.0,<0.16'

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Run unit tests
        run: .venv/bin/python -m pytest -v

  # Contract suite against the REAL Hermes host at main. This is the lane that
  # catches upstream interface drift (a renamed register_platform kwarg, a moved
  # symbol, a dropped MessageEvent/SendResult field) before it reaches a user.
  # Same suite the canary runs on a schedule; this is the per-PR gate version.
  contract-pr:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v7

      - name: Check out Hermes main
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          path: .upstream-hermes
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install test deps + real Hermes host (main)
        run: |
          uv venv --python 3.14
          uv pip install \
            'audioop-lts>=0.2.1; python_version >= "3.13"' 'inkbox>=0.7.11,<1.0.0' \
            'aiohttp>=3.9' 'segno>=1.5' 'pytest>=8' 'ruff>=0.11.0,<0.16'
          uv pip install --editable "$GITHUB_WORKSPACE/.upstream-hermes"

      - name: Contract tests vs real Hermes main
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest \
            --rootdir="$GITHUB_WORKSPACE" \
            --override-ini pythonpath= \
            --import-mode=importlib \
            "$GITHUB_WORKSPACE/tests/contract" -v

      - name: Verify Hermes plugin security scan
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-scan"
          git -C "$GITHUB_WORKSPACE" archive HEAD | tar -x -C "$RUNNER_TEMP/plugin-scan"
          "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$GITHUB_WORKSPACE/tests/ci/check_hermes_plugin_scan.py" \
            "$RUNNER_TEMP/plugin-scan"

  sdk-compatibility:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        sdk: ["0.7.11", "0.7.13", "0.7.14", "0.7.15", "0.7.16"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install published SDK boundary
        run: |
          uv venv --python 3.12
          uv pip install 'inkbox==${{ matrix.sdk }}' 'aiohttp>=3.9' 'segno>=1.5' 'pytest>=8'
      - name: Verify base behavior and structural opt-in gates
        run: .venv/bin/python -m pytest -q tests/test_optional_capabilities.py tests/test_vault_tools.py tests/test_setup_slack.py tests/test_slack_sdk.py tests/test_slack_activity.py tests/test_slack_companion_adapter.py tests/test_imessage_native_sdk.py tests/test_tunnel_tls.py

  windows-unit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install test dependencies
        run: uv sync --extra test --frozen --python 3.12
      - name: Run native Windows unit tests
        run: uv run --frozen python -m pytest -v

  native-install:
    # Exercise the installed layout, not only an editable host/test environment.
    # All remote SDK reads use a loopback fixture; no secrets or live sends.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Set up isolated runtime
        run: echo "HERMES_HOME=$GITHUB_WORKSPACE/.hermes" >> "$GITHUB_ENV"
      - name: Check out Hermes main
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          path: .hermes/hermes-agent
          fetch-depth: 1
      - name: Install actual Hermes
        run: |
          bash "$GITHUB_WORKSPACE/tests/ci/install_hermes.sh" --skip-browser
          echo "$HERMES_HOME/hermes-agent/.hermes/bin" >> "$GITHUB_PATH"
      - name: Native admission and runtime helpers
        run: |
          PLUGIN_SOURCE="$(python3 "$GITHUB_WORKSPACE/tests/ci/stage_hermes_plugin.py" \
            --source "$GITHUB_WORKSPACE" --runtime-home "$HERMES_HOME" --temp-root "$RUNNER_TEMP")"
          mkdir -p "$HERMES_HOME/plugins"
          ln -sfn "$PLUGIN_SOURCE" "$HERMES_HOME/plugins/inkbox"
          hermes plugins enable inkbox
          python3 "$GITHUB_WORKSPACE/tests/ci/hermes_python.py" \
            "$GITHUB_WORKSPACE/tests/ci/restrict_hermes_tools.py"
          SDK_REQUIREMENT="$(python3 "$GITHUB_WORKSPACE/tests/ci/hermes_python.py" \
            "$GITHUB_WORKSPACE/tests/ci/check_hermes_runtime.py")"
          uv venv --python 3.12 "$RUNNER_TEMP/inkbox-live-runner"
          uv pip install --python "$RUNNER_TEMP/inkbox-live-runner/bin/python" \
            --requirements "$GITHUB_WORKSPACE/pyproject.toml" "$SDK_REQUIREMENT" \
            pytest pyyaml fastapi 'uvicorn[standard]'
          "$RUNNER_TEMP/inkbox-live-runner/bin/pytest" tests/test_ci_import_isolation.py -q
          "$RUNNER_TEMP/inkbox-live-runner/bin/python" \
            "$GITHUB_WORKSPACE/tests/ci/check_voice_driver_ws.py"
      - name: Real installed gateway readiness without credentials
        run: python3 "$GITHUB_WORKSPACE/tests/ci/check_native_install.py"
