name: Canary — plugin vs Hermes v0.22.5

# Check the pinned host before full-stack suites.
on:
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Check out Hermes v0.22.5
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: bf0203a794a07aac3ff764972ab9087baa4e4f4e # v0.22.5
          path: .upstream-hermes
          fetch-depth: 1

      - name: Prepare the official Hermes PM toolchain
        id: host-pm
        uses: ./.upstream-hermes/.github/actions/setup-pm
        with:
          toolchain: python
          cache: 'false'
          cache-python: 'false'
          cache-node: 'false'

      - name: Build test deps with the Hermes v0.22.5 lock
        run: |
          "${{ steps.host-pm.outputs.python-path }}" tests/ci/build_contract_environment.py \
            --host "$GITHUB_WORKSPACE/.upstream-hermes" \
            --out "$GITHUB_WORKSPACE/.venv"

      - name: Complete offline suite vs Hermes v0.22.5
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ github.workspace }}/.upstream-hermes
          # Keep independent launcher fixtures out of the bootstrap tool store.
          HERMES_HOME: ${{ runner.temp }}/hermes-contract-home
          HERMES_RUNTIME_DIR: ''
        run: |
          "$GITHUB_WORKSPACE/.venv/bin/python" -c \
            'import gateway.config, gateway.platforms.base, hermes_cli.plugins; print(hermes_cli.plugins.__file__)'
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pytest \
            --rootdir="$GITHUB_WORKSPACE" --override-ini pythonpath= \
            --import-mode=importlib "$GITHUB_WORKSPACE/tests" -q

      - name: Verify Hermes plugin security scan
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ github.workspace }}/.upstream-hermes
          HERMES_HOME: ${{ runner.temp }}/hermes-contract-home
          HERMES_RUNTIME_DIR: ''
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-scan"
          git -C "$GITHUB_WORKSPACE" archive HEAD | tar -x -C "$RUNNER_TEMP/plugin-scan"
          "$GITHUB_WORKSPACE/.venv/bin/python" \
            "$GITHUB_WORKSPACE/tests/ci/check_hermes_plugin_scan.py" \
            "$RUNNER_TEMP/plugin-scan"
