name: Canary — plugin vs Hermes main

# Hermes main moves ~14 commits/day, so it can break us even when we don't push.
# This reusable check runs the host-interface contract tests against the latest
# host revision before full-stack suites.
on:
  workflow_call:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Check out Hermes main
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          path: .upstream-hermes
          fetch-depth: 1

      - name: Install test deps + real Hermes host (main)
        run: |
          uv sync --extra test --python 3.12
          uv pip install --editable "$GITHUB_WORKSPACE/.upstream-hermes"

      - name: Complete offline suite vs real Hermes main
        run: uv run pytest -q
