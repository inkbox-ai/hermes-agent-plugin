[project]
name = "hermes-agent-plugin"
version = "0.2.16"
description = "Inkbox platform plugin for Hermes Agent"
# Inkbox requires Python 3.11 or newer.
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "audioop-lts>=0.2.1; python_version >= '3.13'",
  "inkbox>=0.7.3,<1.0.0",
  "segno>=1.5",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "ruff>=0.11.0,<0.16",
]

[tool.uv]
# Flat-layout Hermes plugin loaded by the gateway, not a pip-installable
# package — keep uv from trying to build/install the project itself.
package = false

[tool.uv.sources]
inkbox = { git = "https://github.com/inkbox-ai/inkbox", rev = "449966c885208d41f995d09c54072e012df9eb1a", subdirectory = "sdk/python" }

[tool.ruff]
line-length = 125

[tool.ruff.lint.per-file-ignores]
# Tests stub the Hermes `gateway.*` host modules into sys.modules before
# importing the plugin, so imports legitimately sit below that setup.
"tests/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
